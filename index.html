<!DOCTYPE html>
<html lang="fr">
<head>
<meta name="description" content="A small word-search tool interface."/>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outil de Recherche de Mots</title>
    <style>
        :root {
            --accent: #3a6ea5;
            --border: #d8d8d8;
            --text-soft: #777;
        }

        body {
            font-family: system-ui, "Segoe UI", Arial, sans-serif;
            background: #f6f6f4;
            color: #222;
            margin: 0;
        }

        .container {
            max-width: 1050px;
            margin: 0 auto;
            padding: 16px;
        }

        h1 {
            font-size: 24px;
            margin: 8px 0 16px;
        }

        /* Grille de cartes pour les criteres de recherche */
        .search-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 10px;
            align-items: start;
        }

        .search-section {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
        }

        @media (min-width: 600px) {
            .search-section.wide {
                grid-column: span 2;
            }
        }

        .search-section h3 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-soft);
            margin: 0 0 8px;
        }

        .search-section label {
            display: inline-block;
            margin: 2px 10px 2px 0;
            font-size: 14px;
        }

        input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            padding: 6px 8px;
            border: 1px solid var(--border);
            border-radius: 5px;
            font-size: 14px;
        }

        input[type="range"] {
            width: 100%;
        }

        .slider-label {
            font-size: 13px;
            color: var(--text-soft);
        }

        .hint {
            font-size: 12px;
            color: var(--text-soft);
            margin-top: 4px;
        }

        .warning {
            color: #b00;
            font-size: 13px;
            margin-top: 4px;
        }

        .semantic-field {
            margin-bottom: 4px;
        }

        .add-field-button {
            padding: 1px 9px;
            font-size: 14px;
            margin-top: 2px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 5px;
            cursor: pointer;
        }

        .actions {
            display: flex;
            gap: 10px;
            align-items: center;
            margin: 16px 0;
        }

        #searchButton {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 10px 24px;
            font-size: 16px;
            cursor: pointer;
        }

        #searchButton:disabled {
            background: #999;
            cursor: wait;
        }

        #resetButton {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 16px;
            font-size: 14px;
            cursor: pointer;
        }

        .result-section {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            margin-top: 4px;
        }

        .result-section h3 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-soft);
            margin: 0 0 8px;
        }

        #resultCount {
            font-size: 13px;
            color: var(--text-soft);
            margin-bottom: 10px;
        }

		.results-wrapper {
			display: flex;
			justify-content: center;
			gap: 20px;
		}

		.words-column {
			display: flex;
			flex-direction: column;
			align-items: flex-end; /* Align words to the right */
			min-width: 160px;
		}

		.bars-column {
			display: flex;
			flex-direction: column;
			align-items: flex-start; /* Align bars to the left */
			width: 210px;
		}

    </style>
    <script>
		// Incrementer quand words_meta.json / vectors.bin sont regeneres :
		// l'URL change et le service worker retelecharge les donnees.
		const DATA_VERSION = 3;
		const MAX_DISPLAYED_RESULTS = 500;
		const MAX_SUGGESTIONS = 15;

		// Echelle logarithmique du slider de frequence : 0..600 -> 0.01..10000 occ/million
		const FREQ_SLIDER_MAX = 600;

		// Base de mots chargee en memoire (tableaux paralleles, voir build_data.py)
		let DB = null;

		// Telecharge un fichier en notifiant la progression (octets recus)
		async function fetchBytes(url, onProgress) {
			const response = await fetch(url);
			if (!response.ok) throw new Error("HTTP " + response.status + " pour " + url);
			if (!response.body) {
				return new Uint8Array(await response.arrayBuffer());
			}
			const reader = response.body.getReader();
			const chunks = [];
			let received = 0;
			while (true) {
				const { done, value } = await reader.read();
				if (done) break;
				chunks.push(value);
				received += value.length;
				if (onProgress) onProgress(value.length);
			}
			const buffer = new Uint8Array(received);
			let offset = 0;
			for (const chunk of chunks) {
				buffer.set(chunk, offset);
				offset += chunk.length;
			}
			return buffer;
		}

		async function loadDatabase(onProgress) {
			const [metaBytes, vecBytes] = await Promise.all([
				fetchBytes("words_meta.json?v=" + DATA_VERSION, onProgress),
				fetchBytes("vectors.bin?v=" + DATA_VERSION, onProgress),
			]);

			const meta = JSON.parse(new TextDecoder().decode(metaBytes));

			// vectors.bin : Float32[count] (echelles) puis Int8[count*dims]
			const vecBuffer = vecBytes.buffer.slice(vecBytes.byteOffset, vecBytes.byteOffset + vecBytes.byteLength);
			const scales = new Float32Array(vecBuffer, 0, meta.count);
			const q = new Int8Array(vecBuffer, meta.count * 4, meta.count * meta.dims);

			// Index mot -> liste des indices (homographes inclus)
			const wordIndex = new Map();
			for (let i = 0; i < meta.count; i++) {
				const w = meta.words[i].toLowerCase();
				if (!wordIndex.has(w)) wordIndex.set(w, []);
				wordIndex.get(w).push(i);
			}

			// Detection des infinitifs : un verbe est a l'infinitif s'il est son
			// propre lemme ("=") ou s'il est le lemme d'un autre verbe de la base
			const verbNature = meta.natureNames.indexOf("verb");
			const verbLemmas = new Set();
			for (let i = 0; i < meta.count; i++) {
				if (meta.natures[i] === verbNature && meta.lemmes[i] && meta.lemmes[i] !== "=") {
					verbLemmas.add(meta.lemmes[i]);
				}
			}
			const isInfinitive = new Uint8Array(meta.count);
			for (let i = 0; i < meta.count; i++) {
				if (meta.natures[i] === verbNature
					&& (meta.lemmes[i] === "=" || verbLemmas.has(meta.words[i].toLowerCase()))) {
					isInfinitive[i] = 1;
				}
			}

			DB = { ...meta, scales, q, wordIndex, verbNature, isInfinitive };
		}

		function getPronunciations(i) {
			return DB.prons[i] ? DB.prons[i].split("|") : [];
		}

		// Renvoie l'ensemble des indices des mots qui riment avec wordToRhyme.
		// Le nombre de phonemes demande est plafonne, pour chaque comparaison, a la
		// longueur de la plus courte des deux prononciations (demander 3 phonemes
		// avec un mot de 2 phonemes, d'un cote ou de l'autre, agit comme 2).
		// Renvoie null si la prononciation du mot de reference est inconnue.
		function findRhymeIndices(wordToRhyme, phonemeCount) {
			wordToRhyme = wordToRhyme.toLowerCase();

			// Prononciations de reference : tous les homographes, en tableaux de phonemes
			const refProns = [];
			for (const ri of DB.wordIndex.get(wordToRhyme) || []) {
				for (const pron of getPronunciations(ri)) {
					refProns.push(pron.split(" "));
				}
			}
			if (refProns.length === 0) return null;

			const matches = new Set();
			for (let i = 0; i < DB.count; i++) {
				let matched = false;
				for (const pron of getPronunciations(i)) {
					const cand = pron.split(" ");
					for (const ref of refProns) {
						const n = Math.min(phonemeCount, ref.length, cand.length);
						let same = true;
						for (let d = 1; d <= n; d++) {
							if (cand[cand.length - d] !== ref[ref.length - d]) {
								same = false;
								break;
							}
						}
						if (same) {
							matched = true;
							break;
						}
					}
					if (matched) break;
				}
				if (matched) matches.add(i);
			}
			return matches;
		}

		// Premier vecteur disponible pour un mot donne, ou null
		function getWordVector(word) {
			for (const ri of DB.wordIndex.get(word) || []) {
				if (DB.scales[ri] > 0) {
					return { q: DB.q.subarray(ri * DB.dims, (ri + 1) * DB.dims), scale: DB.scales[ri] };
				}
			}
			return null;
		}

		// Calcule la distance semantique de chaque indice : moyenne des cosinus vers
		// les mots "evoque" moins moyenne des cosinus vers les mots "n'evoque pas".
		// Les vecteurs sont normalises a la construction : cosinus = scaleA*scaleB*dot(qA,qB).
		// Renvoie un tableau aligne sur indices, ou null si aucun mot de reference utilisable.
		function semanticDistances(indices, evokeWords, avoidWords) {
			const warning = document.getElementById("semanticWarning");
			const unknown = [];

			const collect = (wordList, weight) => {
				const refs = [];
				for (const word of wordList) {
					const vec = getWordVector(word);
					if (vec) refs.push(vec);
					else unknown.push(word);
				}
				// chaque liste pese 1 au total, quel que soit le nombre de champs remplis
				return refs.map(r => ({ q: r.q, scale: r.scale * weight / refs.length }));
			};

			const refs = [...collect(evokeWords, 1), ...collect(avoidWords, -1)];
			if (unknown.length) {
				warning.textContent = "Sans vecteur, ignoré : " + unknown.join(", ");
			}
			if (refs.length === 0) return null;

			const dims = DB.dims;
			const distances = new Float64Array(indices.length);
			for (let k = 0; k < indices.length; k++) {
				const i = indices[k];
				const scale = DB.scales[i];
				if (scale === 0) {
					distances[k] = Infinity; // pas de vecteur pour ce mot
					continue;
				}
				let net = 0;
				const off = i * dims;
				for (const ref of refs) {
					let dot = 0;
					for (let d = 0; d < dims; d++) {
						dot += ref.q[d] * DB.q[off + d];
					}
					net += ref.scale * scale * dot;
				}
				distances[k] = (1 - net) * 2.0;
			}
			return distances;
		}

		// Valeurs non vides des champs "evoque" ou "n'evoque pas"
		function getSemanticFieldValues(containerId) {
			return Array.from(document.querySelectorAll("#" + containerId + " input"))
				.map(input => input.value.trim().toLowerCase())
				.filter(v => v);
		}

		// Bouton "+" : ajoute un champ texte supplementaire
		function addSemanticField(containerId) {
			const container = document.getElementById(containerId);
			const first = container.querySelector("input");
			const div = document.createElement("div");
			div.className = "semantic-field";
			const input = document.createElement("input");
			input.type = "text";
			input.placeholder = first.placeholder;
			input.setAttribute("list", "wordSuggestions");
			div.appendChild(input);
			container.appendChild(div);
			input.focus();
		}

		// "Commence par" facon Scrabble : * = une lettre quelconque.
		// Renvoie une fonction de test, ou null si pas de motif.
		function buildStartsWithMatcher(pattern) {
			if (!pattern) return null;
			if (!pattern.includes("*")) {
				return word => word.startsWith(pattern);
			}
			const escaped = pattern.replace(/[.+?^${}()|[\]\\]/g, "\\$&").replace(/\*/g, ".");
			const regex = new RegExp("^" + escaped);
			return word => regex.test(word);
		}

		// --- Slider de frequence a deux bouts (echelle logarithmique) ---

		function sliderToFreq(value) {
			value = parseInt(value);
			if (value <= 0) return 0;                       // tout en bas : aucune limite basse
			if (value >= FREQ_SLIDER_MAX) return Infinity;  // tout en haut : aucune limite haute
			return Math.pow(10, value / 100 - 2);           // 0.01 .. 10000 occ/million
		}

		function formatFreq(freq) {
			if (freq === 0) return "0";
			if (!isFinite(freq)) return "max";
			if (freq < 1) return freq.toFixed(2);
			if (freq < 10) return freq.toFixed(1);
			return String(Math.round(freq));
		}

		function onFreqSlider(moved) {
			const minEl = document.getElementById("freqMin");
			const maxEl = document.getElementById("freqMax");
			// empeche le croisement des deux curseurs
			if (parseInt(minEl.value) > parseInt(maxEl.value)) {
				if (moved === "min") maxEl.value = minEl.value;
				else minEl.value = maxEl.value;
			}
			document.getElementById("freqMinValue").textContent = formatFreq(sliderToFreq(minEl.value));
			document.getElementById("freqMaxValue").textContent = formatFreq(sliderToFreq(maxEl.value));
		}

		// Affiche la terminaison phonetique retenue a cote du champ "rime avec"
		function updateRhymeEnding() {
			const div = document.getElementById("rhymeEnding");
			const word = document.getElementById("rhymeWith").value.trim().toLowerCase();
			const n = parseInt(document.getElementById("syllableSlider").value);
			if (!DB || !word || !n) {
				div.textContent = "";
				return;
			}
			const endings = new Set();
			for (const ri of DB.wordIndex.get(word) || []) {
				for (const pron of getPronunciations(ri)) {
					const tokens = pron.split(" ");
					endings.add(tokens.slice(-Math.min(n, tokens.length)).join(" "));
				}
			}
			div.textContent = endings.size
				? "terminaison : " + [...endings].map(e => "« " + e + " »").join(" ou ")
				: "";
		}

		function resetSearch() {
			document.querySelectorAll('input[name="syllables"], input[name="nature"]').forEach(cb => cb.checked = true);
			document.querySelector('input[name="genre"][value=""]').checked = true;
			document.querySelector('input[name="nombre"][value=""]').checked = true;
			document.getElementById("freqMin").value = 0;
			document.getElementById("freqMax").value = FREQ_SLIDER_MAX;
			onFreqSlider();
			for (const id of ["evokeFields", "avoidFields"]) {
				document.querySelectorAll("#" + id + " .semantic-field").forEach((div, k) => {
					if (k === 0) div.querySelector("input").value = "";
					else div.remove();
				});
			}
			document.getElementById("rhymeWith").value = "";
			document.getElementById("syllableSlider").value = 0;
			updateSyllableValue(0);
			updateRhymeEnding();
			document.getElementById("startsWith").value = "";
			document.getElementById("rhymeWarning").textContent = "";
			document.getElementById("semanticWarning").textContent = "";
			document.getElementById("wordSuggestions").innerHTML = "";
		}

		async function performSearch() {
			const rhymeWarning = document.getElementById("rhymeWarning");
			if (!DB) {
				rhymeWarning.textContent = "La base de mots est encore en cours de chargement, réessayez dans un instant.";
				return;
			}

			const loadingSpinner = document.getElementById("loadingSpinner");
			loadingSpinner.style.display = "block";
			rhymeWarning.textContent = "";
			document.getElementById("semanticWarning").textContent = "";
			await new Promise(resolve => setTimeout(resolve, 0)); // laisse le spinner s'afficher

			try {
				// Collect search criteria
				const startsWithPattern = document.getElementById("startsWith").value.trim().toLowerCase();
				const startsWithMatcher = buildStartsWithMatcher(startsWithPattern);
				// tout coche = aucun filtre (sinon les mots aux attributs inconnus seraient exclus)
				let syllablesSelected = Array.from(document.querySelectorAll('input[name="syllables"]:checked')).map(cb => parseInt(cb.value));
				if (syllablesSelected.length === document.querySelectorAll('input[name="syllables"]').length) {
					syllablesSelected = [];
				}
				let natureValues = new Set(
					Array.from(document.querySelectorAll('input[name="nature"]:checked')).map(cb => cb.value)
				);
				if (natureValues.size === document.querySelectorAll('input[name="nature"]').length) {
					natureValues = new Set();
				}
				const rhymeWith = document.getElementById("rhymeWith").value.trim();
				const phonemeCount = parseInt(document.getElementById("syllableSlider").value);
				const evokeWords = getSemanticFieldValues("evokeFields");
				const avoidWords = getSemanticFieldValues("avoidFields");
				const genreSelected = document.querySelector('input[name="genre"]:checked').value;
				const nombreSelected = document.querySelector('input[name="nombre"]:checked').value;
				const freqMin = sliderToFreq(document.getElementById("freqMin").value);
				const freqMax = sliderToFreq(document.getElementById("freqMax").value);
				const freqFilterActive = freqMin > 0 || isFinite(freqMax);

				// Rimes : ensemble des indices acceptes (null = pas de contrainte)
				let rhymeSet = null;
				if (rhymeWith && phonemeCount > 0) {
					rhymeSet = findRhymeIndices(rhymeWith, phonemeCount);
					if (rhymeSet === null) {
						rhymeWarning.textContent = `Prononciation pour le mot "${rhymeWith}" introuvable.`;
					}
				}

				// Filtrage en un seul passage sur toute la base
				const indices = [];
				for (let i = 0; i < DB.count; i++) {
					if (startsWithMatcher && !startsWithMatcher(DB.words[i].toLowerCase())) continue;

					if (syllablesSelected.length) {
						const syll = DB.syllables[i];
						if (!syll) continue;
						// la case "5" signifie 5 syllabes ou plus
						if (!syllablesSelected.includes(syll) && !(syllablesSelected.includes(5) && syll >= 5)) continue;
					}

					if (natureValues.size) {
						let cat = DB.natureNames[DB.natures[i]];
						if (cat === "verb") cat = DB.isInfinitive[i] ? "verb-inf" : "verb-conj";
						if (!natureValues.has(cat)) continue;
					}

					if (rhymeSet && !rhymeSet.has(i)) continue;

					if (freqFilterActive) {
						// freq inconnue (-1) traitee comme 0 (tres rare)
						const freq = DB.freqs[i] < 0 ? 0 : DB.freqs[i];
						if (freq < freqMin || freq > freqMax) continue;
					}

					// genre/nombre inconnus ("") passent toujours
					if (genreSelected && DB.genres[i] && DB.genres[i] !== genreSelected) continue;
					if (nombreSelected && DB.nombres[i] && DB.nombres[i] !== nombreSelected) continue;

					indices.push(i);
				}

				// Tri : semantique si des mots de reference sont fournis,
				// sinon par frequence dans la langue (decroissante)
				let sorted = indices;
				let distances = null;
				if (evokeWords.length || avoidWords.length) {
					distances = semanticDistances(indices, evokeWords, avoidWords);
				}
				if (distances) {
					const order = Array.from(indices.keys()).sort((a, b) => distances[a] - distances[b]);
					sorted = order.map(k => indices[k]);
					distances = order.map(k => distances[k]);
				} else {
					sorted = indices.slice().sort((a, b) => DB.freqs[b] - DB.freqs[a]);
				}

				// Dedoublonnage : la liste etant triee du meilleur au moins bon,
				// la premiere occurrence d'un mot est toujours la meilleure
				const seen = new Set();
				const finalIndices = [];
				const finalScores = distances ? [] : null;
				for (let k = 0; k < sorted.length; k++) {
					const w = DB.words[sorted[k]];
					if (seen.has(w)) continue;
					seen.add(w);
					finalIndices.push(sorted[k]);
					if (finalScores) finalScores.push(distances[k]);
				}

				displayResults(finalIndices, finalScores);
			} finally {
				loadingSpinner.style.display = "none";
			}
		}

		// Display results. scores = distances semantiques, ou null : dans ce cas
		// les barres representent la frequence du mot dans la langue (echelle log)
		function displayResults(indices, scores) {
			const wordsColumn = document.querySelector(".words-column");
			const barsColumn = document.querySelector(".bars-column");
			const resultCount = document.getElementById("resultCount");
			wordsColumn.innerHTML = "";  // Clear previous words
			barsColumn.innerHTML = "";   // Clear previous bars

			if (!indices.length) {
				resultCount.textContent = "Aucun résultat.";
				return;
			}

			const shown = Math.min(indices.length, MAX_DISPLAYED_RESULTS);
			resultCount.textContent = indices.length + " résultat" + (indices.length > 1 ? "s" : "")
				+ (shown < indices.length ? " (les " + shown + " premiers sont affichés)" : "")
				+ (scores ? " — barres : proximité sémantique" : " — barres : fréquence dans la langue");

			const wordsFragment = document.createDocumentFragment();
			const barsFragment = document.createDocumentFragment();

			for (let k = 0; k < shown; k++) {
				const i = indices[k];

				// Create an element for the word
				let wordElement = document.createElement("div");
				wordElement.textContent = DB.words[i];
				wordElement.style.height = "10px";  // Fixed height
				wordElement.style.marginBottom = "5px";  // Ensure consistent spacing
				wordElement.style.textAlign = "right";  // Align word to the right
				wordsFragment.appendChild(wordElement);

				// Create an element for the bar (proximity score or frequency)
				let scoreElement = document.createElement("div");
				if (scores) {
					scoreElement.style.width = getBarWidth(scores[k]) + "px";
					scoreElement.style.backgroundColor = getScoreColor(scores[k]);
				} else {
					scoreElement.style.width = getFreqBarWidth(DB.freqs[i]) + "px";
					scoreElement.style.backgroundColor = "#8aa8c8";
				}
				scoreElement.style.height = "10px";  // Fixed height for the bar
				scoreElement.style.marginBottom = "5px";  // Ensure consistent spacing for the bars
				barsFragment.appendChild(scoreElement);
			}

			wordsColumn.appendChild(wordsFragment);
			barsColumn.appendChild(barsFragment);
		}

		// Function to return a color based on proximity score
		function getScoreColor(score) {
			if (score < 0.85) return "green";       // High proximity
			if (score < 1.15) return "yellow";      // Medium proximity
			return "red";                         // Low proximity
		}

		// Function to return the width of the proximity bar based on the score
		function getBarWidth(score) {
			const maxScore = 2.0;  // Define the maximum score for scaling
			const minWidth = 30;   // Minimum width for a poor score
			const maxWidth = 200;  // Maximum width for a good score

			let width = maxWidth - (score * (maxWidth - minWidth) / maxScore);

			// Ensure the bar width doesn't get negative or too small
			return Math.max(minWidth, Math.min(width, maxWidth));
		}

		// Largeur de barre pour une frequence (echelle log de 0.01 a 10000 occ/million)
		function getFreqBarWidth(freq) {
			const minWidth = 4;
			const maxWidth = 200;
			const clamped = Math.min(Math.max(freq < 0 ? 0.01 : freq, 0.01), 10000);
			const norm = (Math.log10(clamped) + 2) / 6; // 0..1
			return Math.round(minWidth + norm * (maxWidth - minWidth));
		}

		function updateSyllableValue(value) {
			document.getElementById("syllableValue").textContent = value;
		}

		// Suggestions au cours de la frappe : remplit la datalist partagee avec les
		// mots correspondants, les plus frequents d'abord. Pour le champ "rime avec",
		// la correspondance se fait par la fin du mot plutot que par le debut.
		function updateSuggestions(text, fromEnd) {
			const datalist = document.getElementById("wordSuggestions");
			text = text.trim().toLowerCase();
			if (text.length < 2 || !DB) {
				datalist.innerHTML = "";
				return;
			}
			const best = new Map(); // mot -> meilleure frequence
			for (let i = 0; i < DB.count; i++) {
				const w = DB.words[i];
				if (fromEnd ? !w.endsWith(text) : !w.startsWith(text)) continue;
				const f = DB.freqs[i];
				if (!best.has(w) || f > best.get(w)) best.set(w, f);
			}
			const top = [...best.entries()]
				.sort((a, b) => b[1] - a[1])
				.slice(0, MAX_SUGGESTIONS);
			datalist.innerHTML = "";
			for (const [w] of top) {
				const option = document.createElement("option");
				option.value = w;
				datalist.appendChild(option);
			}
		}

		function registerServiceWorker() {
			// Le service worker met les donnees en cache : apres la premiere visite,
			// l'outil demarre instantanement et fonctionne hors connexion
			if ("serviceWorker" in navigator
				&& (location.protocol === "https:" || ["localhost", "127.0.0.1"].includes(location.hostname))) {
				navigator.serviceWorker.register("sw.js").catch(() => {});
			}
		}

		// Load the database when the page loads
		window.onload = async function () {
			updateSyllableValue(document.getElementById("syllableSlider").value);
			onFreqSlider();
			registerServiceWorker();

			// Enter dans un champ texte = lancer la recherche
			document.addEventListener("keydown", event => {
				if (event.key === "Enter" && event.target.matches('input[type="text"]')) {
					event.preventDefault();
					performSearch();
				}
			});

			// Suggestions a la frappe sur les champs de mots (delegation :
			// fonctionne aussi pour les champs ajoutes par les boutons "+")
			document.addEventListener("input", event => {
				if (event.target.matches("#evokeFields input, #avoidFields input")) {
					updateSuggestions(event.target.value, false);
				} else if (event.target.id === "rhymeWith") {
					updateSuggestions(event.target.value, true); // par la fin du mot
					updateRhymeEnding();
				}
			});

			const searchButton = document.getElementById("searchButton");
			searchButton.disabled = true;
			let receivedTotal = 0;
			try {
				await loadDatabase(bytes => {
					receivedTotal += bytes;
					searchButton.textContent = "Chargement... " + (receivedTotal / 1e6).toFixed(1) + " Mo";
				});
				searchButton.disabled = false;
				searchButton.textContent = "Rechercher";
			} catch (error) {
				console.error(error);
				searchButton.textContent = "Erreur de chargement de la base";
			}
		}

    </script>

<meta property="og:title" content="Outil de Recherche de Mots"/>
<meta property="og:description" content="A small word-search tool interface."/>
<meta property="og:url" content="https://nurykabe.com/dump/tools/chercheMots/ss/"/>
<meta property="og:type" content="website"/>
</head>
<body>
    <div class="container">
        <h1>Outil de recherche de mots</h1>

		<datalist id="wordSuggestions"></datalist>

		<div class="search-grid">

			<div class="search-section">
				<h3>Nombre de syllabes</h3>
				<label><input type="checkbox" name="syllables" value="1" checked> 1</label>
				<label><input type="checkbox" name="syllables" value="2" checked> 2</label>
				<label><input type="checkbox" name="syllables" value="3" checked> 3</label>
				<label><input type="checkbox" name="syllables" value="4" checked> 4</label>
				<label><input type="checkbox" name="syllables" value="5" checked> 5+</label>
			</div>

			<div class="search-section">
				<h3>Nature</h3>
				<label><input type="checkbox" name="nature" value="noun" checked> Nom</label>
				<label><input type="checkbox" name="nature" value="adjective" checked> Adjectif</label>
				<label><input type="checkbox" name="nature" value="adverb" checked> Adverbe</label><br>
				<label><input type="checkbox" name="nature" value="verb-inf" checked> Verbe à l'infinitif</label>
				<label><input type="checkbox" name="nature" value="verb-conj" checked> Verbe conjugué</label>
			</div>

			<div class="search-section">
				<h3>Genre</h3>
				<label><input type="radio" name="genre" value="m"> Masculin</label>
				<label><input type="radio" name="genre" value="f"> Féminin</label>
				<label><input type="radio" name="genre" value="" checked> Tous</label>
			</div>

			<div class="search-section">
				<h3>Nombre</h3>
				<label><input type="radio" name="nombre" value="s"> Singulier</label>
				<label><input type="radio" name="nombre" value="p"> Pluriel</label>
				<label><input type="radio" name="nombre" value="" checked> Tous</label>
			</div>

			<div class="search-section wide">
				<h3>Fréquence (occurrences par million de mots)</h3>
				<span class="slider-label">minimum : <span id="freqMinValue">0</span></span>
				<input type="range" id="freqMin" min="0" max="600" value="0" oninput="onFreqSlider('min')">
				<span class="slider-label">maximum : <span id="freqMaxValue">max</span></span>
				<input type="range" id="freqMax" min="0" max="600" value="600" oninput="onFreqSlider('max')">
			</div>

			<div class="search-section">
				<h3>Évoque</h3>
				<div id="evokeFields">
					<div class="semantic-field">
						<input type="text" placeholder="un mot de référence" list="wordSuggestions">
					</div>
				</div>
				<button type="button" class="add-field-button" onclick="addSemanticField('evokeFields')">+</button>
				<div id="semanticWarning" class="warning"></div>
			</div>

			<div class="search-section">
				<h3>N'évoque pas</h3>
				<div id="avoidFields">
					<div class="semantic-field">
						<input type="text" placeholder="un mot à éviter" list="wordSuggestions">
					</div>
				</div>
				<button type="button" class="add-field-button" onclick="addSemanticField('avoidFields')">+</button>
			</div>

			<div class="search-section wide">
				<h3>Rime avec</h3>
				<input type="text" id="rhymeWith" placeholder="Entrez un mot pour rimer avec" list="wordSuggestions">
				<div id="rhymeEnding" class="hint"></div>
				<div id="rhymeWarning" class="warning"></div>
				<label for="syllableSlider" class="slider-label">sur combien de phonèmes au minimum : <span id="syllableValue">0</span></label>
				<input type="range" id="syllableSlider" name="syllableSlider" min="0" max="5" value="0" oninput="updateSyllableValue(this.value); updateRhymeEnding();">
			</div>

			<div class="search-section">
				<h3>Commence par</h3>
				<input type="text" id="startsWith" placeholder="ex : b*lle (* = lettre libre)">
			</div>

		</div>

		<div class="actions">
			<button id="searchButton" onclick="performSearch()">Rechercher</button>
			<button id="resetButton" onclick="resetSearch()">Réinitialiser</button>
			<span id="loadingSpinner" style="display: none;">Attendez...</span>
		</div>

        <div class="result-section">
            <h3>Résultats</h3>
			<div id="resultCount"></div>
			<div class="results-wrapper">
				<div class="words-column">
					<!-- Words will go here -->
				</div>
				<div class="bars-column">
					<!-- Bars will go here -->
				</div>
			</div>
        </div>
    </div>

</body>
</html>
